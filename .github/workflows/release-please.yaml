name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write  # Required for OIDC trusted publishing

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GEM_NAME: jekyll-highlight-cards

jobs:
  release-please:
    runs-on: ubuntu-latest
    environment: rubygems
    steps:
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.HELPER_APP_ID }}
          private-key: ${{ secrets.HELPER_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ steps.generate-token.outputs.token }}
          release-type: ruby
          package-name: ${{ env.GEM_NAME }}
          version-file: lib/${{ env.GEM_NAME }}/version.rb

      # Publish to rubygems if a release was created
      - uses: actions/checkout@v6
        if: ${{ steps.release.outputs.release_created }}

      - name: Set up Ruby
        if: ${{ steps.release.outputs.release_created }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Run tests with coverage
        if: ${{ steps.release.outputs.release_created }}
        run: bundle exec rake test

      - name: Upload coverage to Codecov
        if: ${{ steps.release.outputs.release_created }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Build gem
        if: ${{ steps.release.outputs.release_created }}
        run: gem build ${{ env.GEM_NAME }}.gemspec

      - name: Configure RubyGems credentials
        if: ${{ steps.release.outputs.release_created }}
        uses: rubygems/configure-rubygems-credentials@v1.0.0

      - name: Publish to RubyGems
        if: ${{ steps.release.outputs.release_created }}
        run: gem push ${{ env.GEM_NAME }}-${{ steps.release.outputs.version }}.gem
