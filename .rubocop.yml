# RuboCop configuration for jekyll-highlight-cards

require:
  - rubocop-rake
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 2.7
  NewCops: enable
  Exclude:
    - 'vendor/**/*'
    - 'spec/fixtures/**/*'
    - 'examples/**/*'
    - 'planning/**/*'

# Style preferences
Style/StringLiterals:
  Enabled: true
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  Enabled: true
  EnforcedStyle: double_quotes

Style/Documentation:
  Enabled: false  # Will enable after adding YARD documentation

Style/FrozenStringLiteralComment:
  Enabled: true
  EnforcedStyle: always

# Metrics - relaxed for initial development
Metrics/MethodLength:
  Max: 25
  Exclude:
    - 'spec/**/*'

Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'
    - '*.gemspec'

Metrics/ClassLength:
  Max: 200

Metrics/ModuleLength:
  Max: 200

# Layout preferences
Layout/LineLength:
  Max: 120
  AllowedPatterns: ['^\s*#']

# RSpec-specific
RSpec/ExampleLength:
  Max: 15

RSpec/MultipleExpectations:
  Max: 5

RSpec/NestedGroups:
  Max: 5


